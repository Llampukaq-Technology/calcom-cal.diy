# Prueba local del stack con las imágenes publicadas en Docker Hub (no hace build).
# Credenciales de Postgres: se pasan por entorno al invocar compose, no se guardan aquí.
#   POSTGRES_USER=... POSTGRES_PASSWORD=... POSTGRES_DB=... \
#     docker compose -f docker-compose.cloud-test.yml up -d

volumes:
  database-cloud-test:
  redis-cloud-test:

networks:
  stack-cloud-test:
    name: stack-cloud-test

services:
  database:
    container_name: cloud-test-database
    image: postgres:16
    restart: unless-stopped
    volumes:
      - database-cloud-test:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - stack-cloud-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: cloud-test-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-cloud-test:/data
    networks:
      - stack-cloud-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  calcom:
    container_name: cloud-test-calcom
    image: jorgeortega593/calcom-cal.dy:6.2.0
    restart: unless-stopped
    networks:
      - stack-cloud-test
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_HOST=database
      - NEXTAUTH_URL=http://calcom:3000
    depends_on:
      database:
        condition: service_healthy

  calcom-api:
    container_name: cloud-test-calcom-api
    image: jorgeortega593/calcom-cal.dy-api:6.2.0
    restart: unless-stopped
    networks:
      - stack-cloud-test
    ports:
      - "8081:80"
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=80
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - REWRITE_API_V2_PREFIX=1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
