# Cal.diy — stack con imágenes pre-construidas:
#   - Web:     jorgeortega593/calcom-cal.dy:6.2.0
#   - API v2:  jorgeortega593/calcom-cal.dy-api:6.2.0
#
# El entrypoint de la imagen (scripts/start.sh) al arrancar el servicio `calcom`:
#   1. Reemplaza la URL webapp grabada en el build por NEXT_PUBLIC_WEBAPP_URL
#      en los assets estáticos.
#   2. Espera a que DATABASE_HOST acepte conexiones.
#   3. Aplica migraciones (prisma migrate deploy) y seed del app-store.
#   4. Levanta la web en el puerto 3000 del contenedor.
#
# Variables leídas de .env (raíz del proyecto). docker compose las interpola
# automáticamente en este archivo y además las inyecta al contenedor vía env_file.
#
# Notas:
#   - Redis lo consume solo la API v2 (Bull/Throttler); la web usa Upstash
#     REST con fallback Noop.
#   - Los NEXT_PUBLIC_* se hornean en el build del cliente; en runtime solo se
#     re-escribe NEXT_PUBLIC_WEBAPP_URL (el resto aplica del lado servidor).

volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: database
    image: postgres:16
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - stack
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  calcom:
    container_name: calcom
    image: jorgeortega593/calcom-cal.dy:6.2.0
    restart: always
    networks:
      - stack
    expose:
      - "3000"
    env_file: .env
    environment:
      # Tienen prioridad sobre env_file: apuntan al servicio `database`
      # dentro de la red interna de compose.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_HOST=database
    depends_on:
      database:
        condition: service_healthy

  calcom-api:
    container_name: calcom-api
    image: jorgeortega593/calcom-cal.dy-api:6.2.0
    restart: always
    networks:
      - stack
    expose:
      - "${API_PORT:-80}"
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=${API_PORT:-80}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - REWRITE_API_V2_PREFIX=1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Opcional: Prisma Studio para inspeccionar la base de datos en :5555.
  # No arranca con `docker compose up -d`; actívalo con:
  #   docker compose --profile studio up -d studio
  studio:
    image: jorgeortega593/calcom-cal.dy:6.2.0
    restart: unless-stopped
    networks:
      - stack
    expose:
      - "5555"
    profiles: ["studio"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    command:
      - npx
      - prisma
      - studio
      - --schema
      - /calcom/prisma/schema.prisma
      - --host
      - 0.0.0.0
      - --port
      - "5555"
